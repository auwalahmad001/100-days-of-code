<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beginner Grid Dashboard</title>
  <link rel="stylesheet" href="grid.css">
</head>
<body>

  <div class="dashboard">
    <!-- Top Header -->
    <header class="header">
      <h1>Analytics Dashboard</h1>
    </header>

    <!-- Left Sidebar -->
    <aside class="sidebar">
      <nav>
        <a href="#">Overview</a>
        <a href="#">Users</a>
        <a href="#">Sales</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main">
      <!-- Inner Card Grid -->
      <div class="stats-grid">
        <div class="card">
          <h3>Total Users</h3>
          <p class="number">1,240</p>
        </div>
        <div class="card">
          <h3>Revenue</h3>
          <p class="number">$8,450</p>
        </div>
        <div class="card">
          <h3>Active Tasks</h3>
          <p class="number">32</p>
        </div>
        <div class="card">
          <h3>New Signups</h3>
          <p class="number">+18%</p>
        </div>
      </div>

      <!-- Wide Activity Panel -->
      <div class="card">
        <h3>Recent Activity</h3>
        <p>New order received from Abuja.</p>
        <p>Monthly report generated.</p>
      </div>
    </main>
  </div>

</body>
</html>
