<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Navbar and Features</title>
  <link rel="stylesheet" href="flexbox.css">
</head>
<body>

  <!-- Responsive Navigation Bar -->
  <header class="navbar">
    <div class="logo">BrandLogo</div>
    <nav class="nav-links">
      <a href="#features">Features</a>
      <a href="#pricing">Pricing</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Feature Section -->
  <section id="features" class="features">
    <div class="feature-card">
      <h3>Fast Setup</h3>
      <p>Start with clean HTML and CSS without heavy frameworks.</p>

    <div class="feature-card">
      <h3>Responsive</h3>

    </div>

      <p>Use Flexbox gap and alignment instead of manual margins.</p>
    </div>
  </section>
